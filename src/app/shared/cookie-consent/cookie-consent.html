<div
  *ngIf="visible"
  class="cc"
  role="dialog"
  aria-live="polite"
  aria-label="Cookie notice"
>
  <p class="cc-text">
    We use cookies to personalise content, run ads, and analyse traffic.
  </p>

   <div class="cc-actions">
    <a class="cc-btn" style="color: white !important; text-decoration: none !important;" routerLink="/privacy" tabindex="0">Read more</a>
    <button class="cc-btn" (click)="accept()" type="button">Okay</button>
  </div>
</div>
